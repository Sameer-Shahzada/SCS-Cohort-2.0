<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flashlight Effect</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="https://www.freepnglogos.com/uploads/dragon-ball-png/flying-dragon-ball-z-character-transparent-background-0.png" type="image/x-icon">
</head>
<body>
  <main>
    <div id="effect" aria-hidden="true"></div>

    <header class="hero">
      <h1 class="title">Flashlight Effect</h1>
      <p class="subtitle">Move your pointer to reveal the hidden content</p>
    </header>

    <div id="container" class="grid">
      <article class="card">
        <h2>Card 1</h2>
        <p>This is some secret content</p>
      </article>
      <article class="card">
        <h2>Card 2</h2>
        <p>Here is more hidden info</p>
      </article>
      <article class="card">
        <h2>Card 3</h2>
        <p>You found me!</p>
      </article>
      <article class="card">
        <h2>Card 4</h2>
        <p>Keep looking ...</p>
      </article>
      <article class="card">
        <h2>Card 5</h2>
        <p>Almost there...</p>
      </article>
      <article class="card">
        <h2>Card 6</h2>
        <p>The End.</p>
      </article>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
