<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="example">
      <h3>Grid Example 1</h3>
      <main id="main1" class="grid-box">
        <header>Header</header>
        <section>Section</section>
        <div id="div1">div 1</div>
        <div id="div2">div 2</div>
        <div id="div3">div 3</div>
      </main>
    </section>

    <section class="example">
      <h3>Grid Example 2</h3>
      <main id="main2" class="grid-box">
        <header id="head">Header</header>
        <section id="sec">Section</section>
        <div id="div-left">Left</div>
        <div id="bottom-up">Top</div>
        <div id="bottom-down">Bottom</div>
        <div id="div-right">Right</div>
      </main>
    </section>

    <section class="example">
      <h3>Bento Grid</h3>
      <main id="main3" class="grid-box">
        <div id="left-top">Left Top</div>
        <div id="left-bottom">Left Bottom</div>
        <div id="bottom-right">Bottom Right</div>
        <div id="center">Center</div>
        <div id="top-center">Top Center</div>
        <div id="top-right">Top Right</div>
      </main>
    </section>
  </body>
</html>
